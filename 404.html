<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · HYPERNOVA</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#06070b" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<style>
  :root{--bg:#06070b;--text:#eceff5;--muted:#79839a;--accent:#7c5cff;--accent2:#2dd4bf;--line:#1b1f29}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 620px at 82% -12%, rgba(124,92,255,.10), transparent 62%),
      radial-gradient(900px 520px at -12% 8%, rgba(45,212,191,.07), transparent 58%),
      var(--bg);
    color:var(--text);line-height:1.6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{text-align:center;max-width:440px}
  .logo{
    width:42px;height:42px;border-radius:13px;margin:0 auto 22px;position:relative;
    background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));
    box-shadow:0 0 22px rgba(124,92,255,.6);
  }
  .logo::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
  .code{
    font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    font-size:60px;font-weight:600;letter-spacing:-2px;line-height:1;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:19px;font-weight:600;margin:16px 0 8px}
  p{color:var(--muted);font-size:14px;margin-bottom:26px}
  .en{display:block;font-size:13px;opacity:.72;margin-top:4px}
  a.btn{
    display:inline-block;padding:11px 22px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#06070b;font-weight:600;font-size:14px;text-decoration:none;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  a.btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(124,92,255,.32)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"></div>
    <div class="code">404</div>
    <h1>这个页面不存在<span class="en">This page doesn't exist</span></h1>
    <p>你要找的东西可能已经移走或者从来没有过。回首页用仓位计算器吧。</p>
    <a class="btn" href="/">返回首页 · Back to HYPERNOVA</a>
  </div>
</body>
</html>
